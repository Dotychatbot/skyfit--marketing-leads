<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>

<style>
:root{
  --acc:#EF3340; --acc2:#c81e2c; --navy:#104D82; --navy2:#0b3a63; --bg:#f3f4f6; --card:#fff; --tx:#111827; --mut:#6b7280; --bd:#e5e7eb;
  --red:#dc2626; --yel:#d97706; --grn:#16a34a; --blu:#2563eb; --dark:#104D82;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:var(--bg);color:var(--tx);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--mut)} .sm{font-size:13px} .red{color:var(--red)} b{font-weight:700}
header{background:var(--dark);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{letter-spacing:1px} header .muted{color:#c7d6e6} .hlogo{display:flex;align-items:center;gap:8px} .hlogo img{height:30px;background:#fff;border-radius:6px;padding:2px}
.user{display:flex;gap:8px;align-items:center;font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--navy2);padding:6px 8px;position:sticky;top:48px;z-index:4}
.tab{background:none;border:0;color:#dbe6f1;padding:8px 12px;border-radius:8px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--acc);color:#fff}
main{padding:12px;max-width:1100px;margin:0 auto 90px}
.btn{border:1px solid var(--bd);background:#fff;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.prim{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--red);border-color:#fecaca}
.btn.ghost{background:transparent}
header .btn.ghost{color:#fff;border-color:#3d6d99}
.btn.wa{background:#22c55e;border-color:#22c55e;color:#fff}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.big{padding:14px;font-size:16px;width:100%}
.btn.full{width:100%;margin-top:12px}
.btn:disabled{opacity:.6}
.login{max-width:360px;margin:12vh auto;padding:24px;text-align:center}
.logo img{width:170px;max-width:60vw;display:block;margin:0 auto 6px}
.login h1{font-size:18px;margin:4px 0 24px;color:var(--navy)}
.login input{width:100%;padding:14px;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;background:#fff}
.erro{color:var(--red);margin-top:10px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:7px 12px;white-space:nowrap;cursor:pointer;font-size:14px}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.chip.alerta b{color:var(--red)} .chip.on.alerta b{color:#fca5a5}
.busca{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;background:#fff}
#lista{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--card);border-radius:14px;padding:12px;border-left:5px solid var(--bd);box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:6px}
.st-novo{border-left-color:var(--red)} .st-respondido,.st-agendado,.st-compareceu{border-left-color:var(--yel)}
.st-matriculado{border-left-color:var(--grn)} .st-perdido{border-left-color:#9ca3af;opacity:.85}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.nome{font-weight:700;font-size:16px}
.st{font-size:12px;background:var(--bg);padding:3px 8px;border-radius:12px;white-space:nowrap}
.timer{font-weight:700;font-size:13px;padding:2px 8px;border-radius:10px}
.timer.red{background:#fee2e2;color:var(--red);animation:pisca 1.5s infinite} .timer.yel{background:#fef3c7;color:var(--yel)}
@keyframes pisca{50%{opacity:.55}}
.fu{font-size:13px;color:var(--blu)} .fu.hoje{font-weight:700;color:var(--red)}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.acoes .btn{flex:1 1 auto;padding:8px 10px;font-size:13px}
.acoes .btn.ghost,.acoes .btn.ia{flex:0 0 auto;min-width:44px}
.vazio{text-align:center;color:var(--mut);padding:40px 10px;grid-column:1/-1}
.fab{position:fixed;right:16px;bottom:18px;background:var(--acc);color:#fff;border:0;border-radius:30px;padding:16px 22px;font-size:16px;font-weight:700;box-shadow:0 6px 18px rgba(239,51,64,.4);cursor:pointer;z-index:6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:19px;margin-bottom:12px} .sheet h3{font-size:15px;margin:18px 0 8px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px;font-weight:600}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);font-weight:400;font-size:15px}
label textarea{min-height:70px}
label.check{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}
label.check input{width:auto;margin:0;transform:scale(1.3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{border:1px solid var(--bd);background:#fff;border-radius:18px;padding:8px 12px;cursor:pointer;font-size:14px;color:var(--tx);font-weight:500}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hist{list-style:none;font-size:13px} .hist li{padding:6px 0;border-bottom:1px solid var(--bd)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:30;pointer-events:none;font-size:14px}
.toast.on{opacity:1;transform:translateX(-50%)}
/* painel */
.filtroP{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtroP select,.filtroP input{padding:9px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#fff;border-radius:12px;padding:12px}
.kpi .v{font-size:24px;font-weight:800} .kpi .l{font-size:12px;color:var(--mut)} .kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.dest .v{color:var(--navy)} .kpi.ruim .v{color:var(--red)}
.box{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}
.box h3{font-size:15px;margin-bottom:10px}
.duas{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))} .duas .box{margin:0}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:120px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{background:var(--bg);border-radius:6px;height:14px;overflow:hidden} .bt div{background:var(--acc);height:100%;border-radius:6px}
.bv{text-align:right;font-weight:700} .bv small{color:var(--mut);font-weight:400}
.cols{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:16px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.cb{width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:1px}
.cv{font-size:10px;font-weight:700} .cl{font-size:10px;color:var(--mut);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left} th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
.tabw{overflow-x:auto}
.form-in{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}
.form-in label{margin:0}
.papeis{display:flex;flex-direction:column;gap:10px}
.papel{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--bd);background:#fff;font-size:17px;font-weight:700;color:var(--navy);cursor:pointer;text-align:left}
.papel span{font-size:26px} .papel:active{background:#eef4fb}
.papelTit{font-size:19px;font-weight:800;color:var(--navy);margin:-8px 0 14px}
.nomes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nomeBtn{padding:18px 10px;border-radius:14px;border:1px solid var(--bd);background:#fff;font-size:17px;font-weight:700;color:var(--tx);cursor:pointer}
.nomeBtn.ult{border:2px solid var(--navy)}
.voltar{margin-top:18px}
.link{background:none;border:0;color:var(--navy);text-decoration:underline;font-size:14px;cursor:pointer;margin-top:4px}
.demo{margin-top:22px;padding:14px;border-radius:12px;background:#fff;border:2px dashed var(--navy);font-size:14px;color:var(--navy)}
.demobtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.btn.ia{background:#eef4fb;border-color:#c8d9ec;color:var(--navy)}
.ia{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.iaLeitura{background:#eef4fb;border-radius:12px;padding:12px;font-size:14px;line-height:1.45}
.iaLeitura p{margin-top:6px}
.temp{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;margin-right:6px}
.t-quente{background:#fee2e2;color:var(--red)} .t-morno{background:#fef3c7;color:var(--yel)} .t-frio{background:#dbeafe;color:var(--blu)}
.iaResp{border:1px solid var(--bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.iaTxt{white-space:pre-wrap;font-size:15px;line-height:1.45;background:#f9fafb;border-radius:8px;padding:10px}
.iaNext{background:#ecfdf5;color:#065f46;border-radius:12px;padding:12px;font-size:14px}
.carregando{text-align:center;color:var(--mut);padding:20px}
.meta{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.meta .bt div{background:var(--grn)}
.resumo{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap} .resumo div{background:#fff;border-radius:12px;padding:10px 12px;flex:1;min-width:120px;font-size:13px;color:var(--mut)} .resumo b{display:block;font-size:20px;color:var(--tx)}
.lista{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.grupo{font-weight:700;margin:14px 2px 8px;color:var(--navy)}
.dots{display:flex;gap:6px;flex-wrap:wrap} .dot{font-size:12px;padding:3px 8px;border-radius:10px;background:var(--bg);color:var(--mut)}
.dot.ok{background:#dcfce7;color:#166534} .dot.sumido{background:#fef3c7;color:#92400e} .dot.risco{background:#fee2e2;color:var(--red)} .dot.pend{background:#dbeafe;color:var(--navy);font-weight:700}
.form-pub{max-width:440px;margin:0 auto;padding:18px 16px 40px} .fp-logo{width:120px;display:block;margin:6px auto 8px}
.form-pub h1{text-align:center;font-size:22px;color:var(--navy);margin-bottom:6px} .form-pub>p{text-align:center;margin-bottom:18px}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px}
.linkbox{word-break:break-all;background:#f9fafb;border:1px dashed var(--bd);border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
.alertaBox{background:#fff7ed;border:1px solid #fed7aa;font-size:14px}
.retorno{background:#ecfdf5;color:#065f46;border-radius:10px;padding:8px 10px;font-size:13px}
.calc{background:#eef4fb;border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px;line-height:1.6}
.tmk td,.tmk th{white-space:nowrap} .tot td{font-weight:700;background:#f9fafb} td.ok{color:var(--grn);font-weight:700}
#rel{position:fixed;inset:0;background:#e5e7eb;z-index:40;overflow-y:auto;padding-bottom:30px}
.relBar{position:sticky;top:0;display:flex;gap:8px;justify-content:space-between;padding:10px 12px;background:var(--navy)}
.relPg{background:#fff;max-width:900px;margin:14px auto;padding:28px 26px;color:#111;font-size:13px}
.relHead{display:flex;gap:14px;align-items:center;border-bottom:3px solid var(--acc);padding-bottom:12px;margin-bottom:6px}
.relHead img{width:64px} .relHead h1{font-size:20px;color:var(--navy)} .relHead p{color:#555;font-size:12px;margin-top:3px}
.relPg h2{font-size:14px;color:var(--navy);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.rks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .rk{border:1px solid #e5e7eb;border-radius:8px;padding:9px}
.rk b{display:block;font-size:17px;color:var(--navy)} .rk span{font-size:11px;color:#555} .rk small{display:block;font-size:10.5px;color:#777;margin-top:2px}
.relT{width:100%;border-collapse:collapse;font-size:11.5px} .relT th{background:var(--navy);color:#fff;padding:6px;font-weight:600;text-align:left} .relT th.n{text-align:right}
.relT td{padding:6px;border-bottom:1px solid #e5e7eb} .relT small{color:#777}
.relDuas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.relObs{border:1px dashed #9ca3af;border-radius:8px;padding:12px;min-height:80px;font-size:13px}
.relRod{margin-top:20px;font-size:10.5px;color:#777;border-top:1px solid #e5e7eb;padding-top:8px}
@media(max-width:640px){.rks{grid-template-columns:1fr 1fr}.relDuas{grid-template-columns:1fr}.relPg{padding:16px 12px;margin:8px}.relT{font-size:10px}}
body.comRel #app,body.comRel .fab{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff} body.comRel>*:not(#rel){display:none!important}
  #rel{position:static;background:#fff;overflow:visible;padding:0} .relBar{display:none}
  .relPg{margin:0;padding:0;max-width:none;box-shadow:none}
  .relT th{-webkit-print-color-adjust:exact;print-color-adjust:exact} .relHead{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .relObs{border:none;padding:0}
  tr,.rk{break-inside:avoid}
}
.iaBox{border:2px solid var(--navy)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap} .thumb{width:56px;height:56px;border-radius:8px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px;text-decoration:none;border:1px solid var(--bd)}
.thumb img{width:100%;height:100%;object-fit:cover} .mais{align-self:center;font-size:13px;color:var(--mut)}
.crLista{display:flex;flex-direction:column;gap:8px} .crItem{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:6px}
.crInfo{flex:1;min-width:0;font-size:14px} .crInfo small{display:block;color:var(--mut);font-size:12px}
.upl{margin-bottom:4px}
.relCri{display:grid;grid-template-columns:repeat(6,1fr);gap:8px} .relCriItem{font-size:10px;border:1px solid #e5e7eb;border-radius:6px;padding:4px;break-inside:avoid}
.relCriItem img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block} .relCriItem b{display:block;margin-top:3px} .relCriItem small{color:#777}
.relCriIco{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:28px;background:#f3f4f6;border-radius:4px}
@media(max-width:640px){.relCri{grid-template-columns:repeat(3,1fr)}}
.okTxt{color:var(--grn)} .warnTxt{color:var(--yel)}
.atraso{background:#fff7ed;color:#9a3412;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.passos{background:#eef4fb;border-radius:10px;padding:10px 12px;margin-bottom:12px;line-height:1.5} .passos ol{margin:6px 0 0 18px}
.impLista{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto}
.impItem{border:1px solid var(--bd);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.impItem select{padding:9px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.tag{font-size:11px;padding:2px 7px;border-radius:8px;background:var(--bg)} .tag.adm{background:#dbeafe;color:var(--navy)} .tag.off{background:#fee2e2;color:var(--red)}
</style>

    update:async d=>{ store[col][i]=aplicar(store[col][i]||{},d); notify(); },

function fmtMin(m){
  if(m==null || isNaN(m)) return '—';
  if(m<1) return '<1 min';
  if(m<60) return Math.round(m)+' min';
  const h=Math.floor(m/60), r=Math.round(m%60);
  if(h<24) return h+'h'+(r?pad(r):'');
  return Math.floor(h/24)+'d '+(h%24)+'h';
}

function preenche(t,l,x={}){
  return (t||'').replace(/{nome}/g,(l.nome||'').split(' ')[0]).replace(/{recep}/g,S.perfil?.nome||'')
    .replace(/{interesse}/g,(l.interesse||'').toLowerCase()).replace(/{data}/g,x.data||'').replace(/{hora}/g,x.hora||'');
}
function cadPendente(l){
  if(!['respondido','compareceu'].includes(l.status)) return null;
  const feitos=l.cadFeitos||[], d=diasDesde(l.respondidoEm||l.chegadaEm);
  const p=(S.cfg.cadencia||[]).filter(c=>c.dia<=d && !feitos.includes(c.dia));
  return p.length ? p[p.length-1] : null;
}
function podeRepescar(l){
  const n=+S.cfg.diasRepescagem||30;
  return l.status==='perdido' && diasDesde(l.perdidoEm||l.chegadaEm)>=n && (!l.repescadoEm || diasDesde(l.repescadoEm)>=n);
}
function lembreteInfo(l){
  if(l.status!=='agendado' || !l.agendaPara) return null;
  const v=new Date(l.agendaPara), dv=isoDia(v), hoje=isoDia(new Date()), amanha=isoDia(new Date(Date.now()+86400000));
  if(dv===amanha) return {tipo:'dia',feito:!!l.lembretes?.dia,texto:S.cfg.msgLembreteDia,v};
  if(dv===hoje && v>new Date()) return {tipo:'hora',feito:!!l.lembretes?.hora,texto:S.cfg.msgLembreteHora,v};
  return null;
}
function checkinPendente(l){
  if(l.status!=='matriculado' || !l.matriculadoEm) return null;
  const d=diasDesde(l.matriculadoEm), pv=l.posVenda||{};
  return (S.cfg.checkins||[]).find(c=>c.dia<=d && !pv[c.dia]) || null;
}
function ultimoStatusPV(l){ const pv=l.posVenda||{}; const k=Object.keys(pv).map(Number).sort((a,b)=>b-a)[0]; return k!=null?pv[k].status:null; }
function modalMsg(l,titulo,texto,onEnviado,op={}){
  abrirModal(`<h2>${titulo}</h2>
    <label>Mensagem (pode editar)<textarea id="mmTxt" rows="6">${esc(texto)}</textarea></label>
    ${op.extra||''}
    <div class="row"><button class="btn" id="mmCopy" style="flex:1">📋 Copiar</button>
      ${linkWhats(l,'')?`<a class="btn wa" id="mmWa" style="flex:1" target="_blank" rel="noopener" href="#">Enviar no WhatsApp</a>`:''}</div>
    <button class="btn ghost full" data-fechar>Fechar</button>`,()=>{
    const upd=()=>{ if($('#mmWa')) $('#mmWa').href=linkWhats(l,$('#mmTxt').value); };
    upd(); $('#mmTxt').oninput=upd;
    const feito=async()=>{ try{ await onEnviado(); }catch(e){ toast('Erro: '+e.message); } fecharModal(); };
    $('#mmCopy').onclick=async()=>{ await copiar($('#mmTxt').value); feito(); };
    if($('#mmWa')) $('#mmWa').addEventListener('click',()=>setTimeout(feito,300));
    op.mount && op.mount(feito);
  });
}
function avisoNovoLead(l){
  toast('🔔 Novo lead: '+(l.nome||''));
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
  try{ const ac=new (window.AudioContext||window.webkitAudioContext)(), o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination); o.frequency.value=880; g.gain.value=.15; o.start(); o.stop(ac.currentTime+.25); }catch(e){}
}

const MODO_FORM = new URLSearchParams(location.search).has('cadastro');
const DOMINIO_LOGIN = '@leads.skyfit.app';
const limpaUser = u => (u||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9._-]/g,'');
const paraEmail = u => (u||'').includes('@') ? u.trim().toLowerCase() : limpaUser(u)+DOMINIO_LOGIN;
const mostraLogin = e => (e||'').endsWith(DOMINIO_LOGIN) ? e.slice(0,-DOMINIO_LOGIN.length) : (e||'');
auth.onAuthStateChanged(async u=>{
  if(MODO_FORM) return telaForm();
  S.unsub.forEach(f=>f()); S.unsub=[]; S.perfil=null; clearInterval(S.tick);
  if(!u) return telaLogin();
  try{
    const ref=db.collection('usuarios').doc(u.uid);
    let snap=await ref.get();
    if(!snap.exists && ADMIN_EMAILS.map(e=>e.toLowerCase()).includes((u.email||'').toLowerCase())){
      await ref.set({nome:'Administrador',email:u.email,papel:'admin',ativo:true,criadoEm:FV.serverTimestamp()});
      snap=await ref.get();
    }
    if(!snap.exists || !snap.data().ativo){ await auth.signOut(); return telaLogin('Acesso não liberado. Fale com o administrador.'); }
    S.perfil={uid:u.uid,...snap.data()};
    S.aba = {admin:'painel',agencia:'agencia'}[S.perfil.papel] || 'leads';
    S.filtro='abertos'; S.filtroAl='pend'; S.busca='';
    iniciar();
  }catch(e){ console.error(e); await auth.signOut(); telaLogin('Erro ao carregar acesso: '+e.message); }
});

async function telaLogin(msg='',papel=LS.get('papel'),pessoa=null){
  const topo=`<div class="logo"><img src="${LOGO}" alt="Sky Fit Academia"></div><h1>Controle de Leads</h1>`;
  const demo=DEMO?`<div class="demo"><b>Modo demonstração</b><br>Dados fictícios, nada é salvo. Entre como:
      <div class="demobtns">${DEMO_USERS.map(u=>`<button class="btn" data-demo="${u.email}">${u.papel==='admin'?'👑 ':''}${esc(u.nome)}</button>`).join('')}</div></div>`:'';
  const ligarDemo=()=>document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>auth.signInWithEmailAndPassword(b.dataset.demo,'demo'));
  const entrar=async(email,senha,botao)=>{
    botao.disabled=true; botao.textContent='Entrando...';
    try{ await auth.signInWithEmailAndPassword(email,senha); }
    catch(err){ telaLogin(err.code==='auth/too-many-requests'?'Muitas tentativas. Espere alguns minutos e tente de novo.':'Senha incorreta.',papel,pessoa); }
  };
  // 1) escolha do tipo de acesso
  if(!papel){
    $('#app').innerHTML=`<div class="login">${topo}<p class="muted" style="margin:-10px 0 16px">Como você vai entrar?</p>
      <div class="papeis">${Object.entries(PAPEIS_LOGIN).map(([k,[ic,t]])=>`<button class="papel" data-p="${k}"><span>${ic}</span>${t}</button>`).join('')}</div>
      <p class="erro">${esc(msg)}</p>${demo}</div>`;
    document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ LS.set('papel',b.dataset.p); telaLogin('',b.dataset.p); });
    return ligarDemo();
  }
  const [ic,titulo]=PAPEIS_LOGIN[papel]||['','']; 
  const voltar=`<button class="btn ghost sm voltar" id="lVoltar">← Trocar tipo de acesso</button>`;
  // 2a) administrador: e-mail + senha + esqueci a senha
  if(papel==='admin'){
    $('#app').innerHTML=`<div class="login">${topo}<div class="papelTit">${ic} ${titulo}</div>
      <form id="fLogin">
        <input type="email" id="lEmail" placeholder="E-mail do administrador" required autocomplete="username" value="${esc(LS.get('adminEmail')||'')}">
        <input type="password" id="lSenha" placeholder="Senha" required autocomplete="current-password">
        <button class="btn prim big">Entrar</button>
        <p class="erro">${esc(msg)}</p>
      </form>
      <button class="link" id="lEsqueci">Esqueci minha senha</button>
      ${voltar}${demo}</div>`;
    $('#fLogin').onsubmit=e=>{ e.preventDefault(); const em=$('#lEmail').value.trim().toLowerCase(); LS.set('adminEmail',em); entrar(em,$('#lSenha').value,e.target.querySelector('button')); };
    $('#lEsqueci').onclick=async()=>{
      const em=$('#lEmail').value.trim().toLowerCase();
      if(!em||!em.includes('@')) return telaLogin('Digite o seu e-mail de administrador e toque de novo em "Esqueci minha senha".','admin');
      try{ auth.languageCode='pt'; await auth.sendPasswordResetEmail(em); }catch(e){}
      telaLogin('Se esse e-mail for de um administrador, chegou um link para criar uma senha nova. Confira também o spam.','admin');
    };
    $('#lVoltar').onclick=()=>{ LS.set('papel',null); telaLogin('',''); };
    return ligarDemo();
  }
  // 2b) recepção / marketing: escolhe o nome
  if(!pessoa){
    $('#app').innerHTML=`<div class="login">${topo}<div class="papelTit">${ic} ${titulo}</div><p class="muted carregando">Carregando...</p></div>`;
    const lista=(await carregarLogins()).filter(x=>x.papel===papel).sort((a,b)=>a.nome.localeCompare(b.nome));
    const ult=LS.get('pessoa');
    $('#app').innerHTML=`<div class="login">${topo}<div class="papelTit">${ic} ${titulo}</div>
      <p class="muted" style="margin-bottom:12px">Toque no seu nome</p>
      <div class="nomes">${lista.map(x=>`<button class="nomeBtn ${x.usuario===ult?'ult':''}" data-u="${esc(x.usuario)}">${esc(x.nome)}</button>`).join('')
        ||'<p class="muted">Nenhum acesso cadastrado ainda. Fale com o administrador.</p>'}</div>
      <p class="erro">${esc(msg)}</p>${voltar}${demo}</div>`;
    document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>telaLogin('',papel,lista.find(x=>x.usuario===b.dataset.u)));
    $('#lVoltar').onclick=()=>{ LS.set('papel',null); telaLogin('',''); };
    return ligarDemo();
  }
  // 3) senha da pessoa escolhida
  $('#app').innerHTML=`<div class="login">${topo}<div class="papelTit">${ic} ${esc(pessoa.nome)}</div>
    <form id="fLogin">
      <input type="text" value="${esc(pessoa.usuario)}" autocomplete="username" style="display:none" readonly>
      <input type="password" id="lSenha" placeholder="Sua senha" required autocomplete="current-password" autofocus>
      <button class="btn prim big">Entrar</button>
      <p class="erro">${esc(msg)}</p>
    </form>
    <p class="sm muted" style="margin-top:6px">Esqueceu a senha? Fale com o administrador.</p>
    <button class="btn ghost sm voltar" id="lOutro">← Não sou ${esc(pessoa.nome)}</button></div>`;
  $('#fLogin').onsubmit=e=>{ e.preventDefault(); LS.set('pessoa',pessoa.usuario); entrar(paraEmail(pessoa.usuario),$('#lSenha').value,e.target.querySelector('button')); };
  $('#lOutro').onclick=()=>telaLogin('',papel);
}

// Lista pública de nomes para a tela de login (sem senhas). Só o admin atualiza.
let _loginsJson=null;
async function sincronizarLogins(){
  if(S.perfil?.papel!=='admin') return;
  const lista=S.usuarios.filter(u=>u.ativo&&u.papel!=='admin').map(u=>({nome:u.nome,usuario:mostraLogin(u.email),papel:u.papel}))
    .sort((a,b)=>a.nome.localeCompare(b.nome));
  const js=JSON.stringify(lista); if(js===_loginsJson) return;
  try{ await db.collection('config').doc('publico').set({logins:lista},{merge:true}); _loginsJson=js; LOGINS_PUB=null; }catch(e){ console.warn('logins',e); }
}

/* ---------- dados ---------- */
function iniciar(){
  const subCamp=()=>{
    S.unsub.push(db.collection('campanhas').onSnapshot(q=>{ S.campanhas=q.docs.map(d=>({id:d.id,...d.data()})); renderSeguro(); }));
  };
  if(S.perfil.papel==='agencia'){
    S.leads=[]; S.cfg={...CONFIG_PADRAO};
    subCamp();
    S.unsub.push(db.collection('metricas').onSnapshot(q=>{ S.metricas=q.docs.map(d=>({id:d.id,...d.data()})); renderSeguro(); }));
    return render();
  }
  subCamp();
  S.unsub.push(db.collection('config').doc('geral').onSnapshot(d=>{ S.cfg={...CONFIG_PADRAO,...(d.data()||{})}; renderSeguro(); }));
  const desde=new Date(); desde.setDate(desde.getDate()-400); S.leadsCarregados=false;
  S.unsub.push(db.collection('leads').where('chegadaEm','>=',TS.fromDate(desde)).orderBy('chegadaEm','desc')
    .onSnapshot(q=>{ const novos=q.docs.map(d=>({id:d.id,...d.data()}));
      if(S.leadsCarregados){ const ant=new Set(S.leads.map(l=>l.id)); const ch=novos.find(l=>!ant.has(l.id)&&l.status==='novo'&&l.registradoPor?.uid!==S.perfil.uid); if(ch) avisoNovoLead(ch); }
      S.leads=novos; S.leadsCarregados=true; renderSeguro(); }, e=>toast('Erro: '+e.message)));
  if(S.perfil.papel==='admin'){
    S.unsub.push(db.collection('usuarios').onSnapshot(q=>{ S.usuarios=q.docs.map(d=>({uid:d.id,...d.data()})); sincronizarLogins(); renderSeguro(); }));
    S.unsub.push(db.collection('metricas').onSnapshot(q=>{ S.metricas=q.docs.map(d=>({id:d.id,...d.data()})); renderSeguro(); }));
    S.unsub.push(db.collection('gastos').orderBy('data','desc').onSnapshot(q=>{ S.gastos=q.docs.map(d=>({id:d.id,...d.data()})); renderSeguro(); }));
  }
  render();
  S.tick=setInterval(()=>{ if(S.aba==='leads' && $('#lista')) renderLista(); },30000);
  S.previewForm=false;
}

function focoEmCampo(){ const a=document.activeElement; return a && $('#main')?.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
function renderSeguro(){
  if(!S.perfil || S.previewForm) return;
  if(S.aba==='leads' && $('#lista')) return renderLista();
  if(focoEmCampo()){ S.pendente=true; return; }
  render();
}
document.addEventListener('focusout',()=>setTimeout(()=>{ if(S.pendente && !focoEmCampo()){ S.pendente=false; render(); } },300));

/* ---------- layout ---------- */
function render(){
  if(!S.perfil) return;
  const adm=S.perfil.papel==='admin';
  const nAg=S.leads.filter(l=>l.status==='agendado'&&l.agendaPara&&isoDia(new Date(l.agendaPara))===isoDia(new Date())).length;
  const nAl=S.leads.filter(l=>checkinPendente(l)).length;
  const ag=S.perfil.papel==='agencia';
  const abas=ag?[['agencia','📣 Campanhas']]:[adm&&['painel','📊 Painel'],adm&&['marketing','📣 Marketing'],['leads','📋 Leads'],['agenda','🗓 Agenda'+(nAg?` (${nAg})`:'')],['alunos','💪 Alunos'+(nAl?` (${nAl})`:'')],
    adm&&['equipe','👥 Equipe'],adm&&['config','⚙️ Ajustes']].filter(Boolean);
  $('#app').innerHTML=`
    <header><div class="hlogo"><img src="${LOGO}" alt=""><div><b>SKY FIT</b> <span class="muted">${ag?'Agência':'Leads'}${DEMO?' · DEMO':''}</span></div></div>
      <div class="user">${esc(S.perfil.nome)} <button class="btn ghost sm" id="sair">Sair</button></div></header>
    <nav>${abas.map(([k,l])=>`<button class="tab ${S.aba===k?'on':''}" data-aba="${k}">${l}</button>`).join('')}</nav>
    <main id="main"></main>
    ${S.aba==='leads'?'<button class="fab" id="novo">+ Novo lead</button>':''}`;
  $('#sair').onclick=()=>auth.signOut();
  document.querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{ S.aba=b.dataset.aba; render(); window.scrollTo(0,0); });
  if($('#novo')) $('#novo').onclick=modalNovo;
  (({painel:vPainel,marketing:vMarketing,leads:vLeads,agenda:vAgenda,alunos:vAlunos,gastos:vMarketing,equipe:vEquipe,config:vConfig,agencia:vAgencia})[S.aba]||vLeads)();
}

/* ======================= LEADS ======================= */
const FILTROS = {
  abertos:  l=>!fechado(l),
  novo:     l=>l.status==='novo',
  followup: l=>!fechado(l) && l.followUp && l.followUp<=isoDia(new Date()),
  hoje:     l=>isoDia(toD(l.chegadaEm))===isoDia(new Date()),
  cadencia: l=>!!cadPendente(l),
  repescagem: l=>podeRepescar(l),
  fechados: fechado,
  todos:    ()=>true
};
function vLeads(){
  const meta=+(S.cfg.metas||{})[S.perfil.uid]||0;
  const mesIni=new Date(); mesIni.setDate(1); mesIni.setHours(0,0,0,0);
  const feitas=S.leads.filter(l=>l.status==='matriculado'&&(l.fechadoPor||l.atendidoPor)?.uid===S.perfil.uid&&toD(l.matriculadoEm)>=mesIni).length;
  $('#main').innerHTML=`${meta?`<div class="meta"><div class="row sm"><b>🎯 Sua meta do mês</b><span><b>${feitas}</b> de ${meta} matrículas</span></div>
      <div class="bt"><div style="width:${Math.min(100,feitas/meta*100)}%"></div></div>
      ${+S.cfg.comissao?`<div class="sm muted">Comissão estimada: ${moeda(feitas*S.cfg.comissao)}</div>`:''}</div>`:''}
    <div class="chips" id="chips"></div>
    <input class="busca" id="busca" placeholder="🔍 Buscar por nome ou telefone" value="${esc(S.busca)}">
    <div id="lista"></div>`;
  $('#busca').oninput=e=>{ S.busca=e.target.value; renderLista(); };
  $('#chips').onclick=e=>{ const c=e.target.closest('[data-f]'); if(c){ S.filtro=c.dataset.f; renderLista(); } };
  $('#lista').onclick=e=>{
    const b=e.target.closest('[data-a]'); if(!b) return;
    acao(b.closest('.card').dataset.id, b.dataset.a);
  };
  renderLista();
}
function renderLista(){
  const n=k=>S.leads.filter(FILTROS[k]).length;
  const chips=[['abertos','Em aberto',n('abertos')],['novo','Sem resposta',n('novo')],['followup','Retornar hoje',n('followup')],
    ['cadencia','📨 Cadência',n('cadencia')],['repescagem','♻️ Repescagem',n('repescagem')],['hoje','Chegaram hoje',n('hoje')],['fechados','Fechados',null],['todos','Todos',null]];
  $('#chips').innerHTML=chips.map(([k,l,c])=>`<button class="chip ${S.filtro===k?'on':''} ${k==='novo'&&c?'alerta':''}" data-f="${k}">${l}${c!=null?` <b>${c}</b>`:''}</button>`).join('');
  const b=S.busca.toLowerCase().trim(), bd=b.replace(/\D/g,'');
  let L=S.leads.filter(FILTROS[S.filtro]).filter(l=>!b || (l.nome||'').toLowerCase().includes(b) || (bd && (l.whatsapp||'').replace(/\D/g,'').includes(bd)));
  // sem resposta primeiro (mais antigo = mais urgente), depois o resto do mais recente pro mais antigo
  L.sort((x,y)=>{
    const rx=x.status==='novo'?0:1, ry=y.status==='novo'?0:1;
    if(rx!==ry) return rx-ry;
    return rx===0 ? toD(x.chegadaEm)-toD(y.chegadaEm) : toD(y.chegadaEm)-toD(x.chegadaEm);
  });
  $('#lista').innerHTML = L.length ? L.map(card).join('') : `<div class="vazio">Nenhum lead aqui.</div>`;
}
function linkWhats(l,texto){
  let d=(l.whatsapp||'').replace(/\D/g,''); if(!d) return '';
  if(d.length<=11) d='55'+d;
  const msg=texto!=null ? texto : preenche(S.cfg.msgWhats,l);
  return `https://wa.me/${d}?text=${encodeURIComponent(msg)}`;
}
function card(l){
  const ch=toD(l.chegadaEm), agora=new Date(), alerta=+S.cfg.alertaMin||15;
  let tempo='';
  if(l.status==='novo'){ const m=minEntre(ch,agora); tempo=`<span class="timer ${m>alerta?'red':'yel'}">⏱ há ${fmtMin(m)}</span>`; }
  else if(l.respondidoEm){ tempo=`<span class="muted sm">Resp. em ${fmtMin(minEntre(ch,toD(l.respondidoEm)))}</span>`; }
  const ag=l.agendaPara?new Date(l.agendaPara):null;
  return `<div class="card st-${l.status}" data-id="${l.id}">
    <div class="row"><div><div class="nome">${esc(l.nome)}</div>
      <div class="muted sm">${esc(l.interesse||'—')} · ${esc(l.origem||'—')}${l.campanha?' · '+esc(l.campanha):''}</div></div>
      <span class="st">${l.viaForm?'📝 ':''}${ROTULO[l.status]}</span></div>
    ${l.indicadoPor?`<div class="sm">🤝 Indicado por <b>${esc(l.indicadoPor)}</b></div>`:''}
    <div class="row sm"><span>Chegou ${dataBR(ch)} às ${hora(ch)}</span>${tempo}</div>
    ${l.atendidoPor?`<div class="sm muted">Atendido por <b>${esc(l.atendidoPor.nome)}</b>${l.fechadoPor?` · Fechou: <b>${esc(l.fechadoPor.nome)}</b>`:''}</div>`:''}
    ${l.status==='agendado'&&ag?`<div class="sm">🗓 Visita: ${dataBR(ag)} às ${hora(ag)}</div>`:''}
    ${l.status==='perdido'?`<div class="sm red">Objeção: ${esc(l.objecao||'—')}${l.obsPerda?' — '+esc(l.obsPerda):''}</div>`:''}
    ${l.status==='matriculado'&&(l.plano||l.valor)?`<div class="sm" style="color:var(--grn)">🏆 ${esc(l.plano||'')} ${l.valor?moeda(l.valor):''}</div>`:''}
    ${l.followUp&&!fechado(l)?`<div class="fu ${l.followUp<=isoDia(agora)?'hoje':''}">📅 Retornar em ${diaBR(l.followUp)}</div>`:''}
    ${cadPendente(l)?`<div class="fu hoje">📨 Cadência: mensagem do dia ${cadPendente(l).dia} pendente</div>`:''}
    ${lembreteInfo(l)&&!lembreteInfo(l).feito?`<div class="fu hoje">🔔 Enviar lembrete da visita</div>`:''}
    ${podeRepescar(l)?`<div class="fu">♻️ Pronto para repescagem (${diasDesde(l.perdidoEm||l.chegadaEm)} dias)</div>`:''}
    <div class="acoes">${acoes(l)}</div></div>`;
}
function acoes(l){
  const B=(a,t,c='')=>`<button class="btn ${c}" data-a="${a}">${t}</button>`;
  const w=linkWhats(l); const wa=w?`<a class="btn wa" href="${w}" target="_blank" rel="noopener">WhatsApp</a>`:'';
  const porStatus={
    novo:[B('respondi','✅ Respondi','prim')],
    respondido:[B('agendar','🗓 Agendou','prim'),B('matricular','🏆 Matriculou'),B('followup','📅 Retornar')],
    agendado:[B('compareceu','👍 Veio','prim'),B('naoveio','Não veio'),B('matricular','🏆 Matriculou')],
    compareceu:[B('matricular','🏆 Matriculou','prim'),B('followup','📅 Retornar')],
    matriculado:[B('reabrir','Reabrir','ghost')],
    perdido:[B('reabrir','Reabrir','ghost')]
  }[l.status]||[];
  const fu = l.followUp && !fechado(l) ? B('fuok','✔ Retornei') : '';
  const li=lembreteInfo(l), cp=cadPendente(l);
  const extra=(li&&!li.feito?B('lemb','🔔 Lembrete','prim'):'')+(cp?B('cad','📨 Enviar dia '+cp.dia,'prim'):'')+(podeRepescar(l)?B('repescar','♻️ Repescar','prim'):'');
  return wa + extra + porStatus.join('') + fu + (fechado(l)?'':B('perdido','❌ Perdido','danger')) + B('ia','🤖 IA','ia') + B('detalhes','⋯','ghost');
}

async function acao(id,a){
  const l=S.leads.find(x=>x.id===id); if(!l) return;
  const ref=db.collection('leads').doc(id);
  const avanca=(st,extra={},txt)=>ref.update({status:st, etapaMax:Math.max(l.etapaMax||0,ETAPAS.indexOf(st)), ...extra, historico:FV.arrayUnion(hist(txt||ROTULO[st]))});
  const garanteResp = () => l.respondidoEm ? {} : {respondidoEm:TS.now(), atendidoPor:eu()};
  try{
    switch(a){
      case 'respondi': await avanca('respondido',{respondidoEm:TS.now(),atendidoPor:eu()},'Respondeu o lead'); toast('Resposta registrada ✅'); break;
      case 'compareceu': await avanca('compareceu',{compareceuEm:TS.now()},'Compareceu à visita'); toast('Registrado 👍'); break;
      case 'fuok': await ref.update({followUp:FV.delete(),historico:FV.arrayUnion(hist('Retorno feito'))}); toast('Retorno registrado'); break;
      case 'agendar': return modalAgendar(l,ref,avanca,garanteResp);
      case 'matricular': return modalMatricula(l,avanca,garanteResp);
      case 'perdido': return modalPerdido(l,ref);
      case 'followup': return modalFollowup(l,ref,false);
      case 'naoveio': return modalFollowup(l,ref,true);
      case 'reabrir':
        await ref.update({status:l.respondidoEm?'respondido':'novo', historico:FV.arrayUnion(hist('Lead reaberto'))}); toast('Lead reaberto'); break;
      case 'detalhes': return modalDetalhes(l);
      case 'ia': return modalIA(l);
      case 'lemb': { const li=lembreteInfo(l); if(!li) return;
        return modalMsg(l,'🔔 Lembrete da visita — '+esc(l.nome),preenche(li.texto,l,{data:dataBR(li.v),hora:hora(li.v)}),
          ()=>ref.update({lembretes:{...(l.lembretes||{}),[li.tipo]:true},historico:FV.arrayUnion(hist(li.tipo==='dia'?'Lembrete enviado (véspera)':'Lembrete enviado (dia)'))}).then(()=>toast('Lembrete registrado 🔔'))); }
      case 'cad': { const c=cadPendente(l); if(!c) return;
        return modalMsg(l,`📨 Cadência dia ${c.dia} — ${esc(l.nome)}`,preenche(c.texto,l),
          ()=>ref.update({cadFeitos:FV.arrayUnion(...(S.cfg.cadencia||[]).filter(x=>x.dia<=c.dia).map(x=>x.dia)),historico:FV.arrayUnion(hist('Cadência dia '+c.dia+' enviada'))}).then(()=>toast('Mensagem registrada 📨'))); }
      case 'repescar':
        return modalMsg(l,'♻️ Repescagem — '+esc(l.nome),preenche(S.cfg.msgRepescagem,l),
          ()=>ref.update({repescadoEm:TS.now(),historico:FV.arrayUnion(hist('Repescagem enviada'))}).then(()=>toast('Repescagem registrada. Se responder, toque em Reabrir ♻️')));
    }
  }catch(e){ toast('Erro: '+e.message); }
}

/* ======================= AGENDA ======================= */
function vAgenda(){
  const agora=new Date(), hoje=isoDia(agora), amanha=isoDia(new Date(Date.now()+86400000));
  const ag=S.leads.filter(l=>l.status==='agendado'&&l.agendaPara).map(l=>({l,d:new Date(l.agendaPara)})).sort((a,b)=>a.d-b.d);
  const grupos=[
    ['⚠️ Já passou — marque se veio',x=>x.d<agora],
    ['Hoje',x=>x.d>=agora&&isoDia(x.d)===hoje],
    ['Amanhã',x=>isoDia(x.d)===amanha],
    ['Próximos dias',x=>isoDia(x.d)>amanha]];
  const pend=ag.filter(x=>{ const li=lembreteInfo(x.l); return li&&!li.feito; }).length;
  const item=({l,d})=>{ const li=lembreteInfo(l);
    return `<div class="card st-agendado" data-id="${l.id}">
      <div class="row"><div><div class="nome">${hora(d)} · ${esc(l.nome)}</div>
        <div class="muted sm">${dataBR(d)} · ${esc(l.interesse||'')}${l.atendidoPor?' · agendado por '+esc(l.atendidoPor.nome):''}</div></div>
        ${li?`<span class="st">${li.feito?'✔ lembrete enviado':'🔔 lembrete pendente'}</span>`:''}</div>
      <div class="acoes">${li&&!li.feito?Bt('lemb','🔔 Lembrete','prim'):''}${Bt('compareceu','👍 Veio')}${Bt('naoveio','Não veio')}${Bt('agendar','Reagendar')}${Bt('ia','🤖','ia')}</div></div>`; };
  $('#main').innerHTML=`<div class="resumo">
      <div><b>${ag.filter(x=>isoDia(x.d)===hoje).length}</b>visitas hoje</div>
      <div><b>${ag.filter(x=>isoDia(x.d)===amanha).length}</b>amanhã</div>
      <div><b style="color:${pend?'var(--red)':'inherit'}">${pend}</b>lembretes pendentes</div></div>
    ${grupos.map(([t,f])=>{ const g=ag.filter(f); return g.length?`<div class="grupo">${t}</div><div class="lista">${g.map(item).join('')}</div>`:''; }).join('')
      || '<div class="vazio">Nenhuma visita agendada.</div>'}
    <p class="sm muted" style="margin-top:12px">Lembretes: na véspera (confirmação) e no dia (antes da aula). Toque em 🔔, envie e pronto.</p>`;
  $('#main').onclick=e=>{ const b=e.target.closest('[data-a]'); if(b) acao(b.closest('.card').dataset.id,b.dataset.a); };
}

/* ======================= ALUNOS (PÓS-VENDA 90 DIAS) ======================= */
function vAlunos(){
  const A=S.leads.filter(l=>l.status==='matriculado'&&l.matriculadoEm&&diasDesde(l.matriculadoEm)<=100)
    .sort((a,b)=>toD(b.matriculadoEm)-toD(a.matriculadoEm));
  const F={pend:l=>!!checkinPendente(l), risco:l=>['sumido','risco'].includes(ultimoStatusPV(l)), todos:()=>true};
  S.filtroAl=S.filtroAl||'pend';
  const L=A.filter(F[S.filtroAl]);
  const rot={bem:'✔',sumido:'⚠️',risco:'🚨'};
  const item=l=>{ const cp=checkinPendente(l), pv=l.posVenda||{}, us=ultimoStatusPV(l);
    return `<div class="card st-${us==='risco'?'novo':us==='sumido'?'respondido':'matriculado'}" data-id="${l.id}">
      <div class="row"><div><div class="nome">${esc(l.nome)}</div>
        <div class="muted sm">${esc(l.plano||'')} · matriculado em ${dataBR(toD(l.matriculadoEm))} (há ${diasDesde(l.matriculadoEm)} dias)${l.atendidoPor?' · '+esc(l.atendidoPor.nome):''}</div></div></div>
      <div class="dots">${(S.cfg.checkins||[]).map(c=>{ const f=pv[c.dia]; const cls=f?(f.status==='bem'?'ok':f.status):(cp&&cp.dia===c.dia?'pend':'');
        return `<span class="dot ${cls}">${f?rot[f.status]||'✔':''} Dia ${c.dia}</span>`; }).join('')}</div>
      ${us&&us!=='bem'?`<div class="sm red">Último contato: ${us==='sumido'?'aluno sumido':'risco de cancelar'}${pv[Object.keys(pv).map(Number).sort((a,b)=>b-a)[0]]?.obs?' — '+esc(pv[Object.keys(pv).map(Number).sort((a,b)=>b-a)[0]].obs):''}</div>`:''}
      <div class="acoes">${cp?Bt('checkin','💬 Check-in dia '+cp.dia,'prim'):''}${Bt('checkinlivre','📝 Registrar contato')}${Bt('detalhes','⋯','ghost')}</div></div>`; };
  $('#main').innerHTML=`<div class="resumo">
      <div><b>${A.length}</b>novos alunos (90 dias)</div>
      <div><b style="color:${A.filter(F.pend).length?'var(--navy)':'inherit'}">${A.filter(F.pend).length}</b>check-ins pendentes</div>
      <div><b style="color:${A.filter(F.risco).length?'var(--red)':'inherit'}">${A.filter(F.risco).length}</b>em risco</div></div>
    <div class="chips">${[['pend','Check-ins pendentes'],['risco','Em risco'],['todos','Todos']].map(([k,t])=>`<button class="chip ${S.filtroAl===k?'on':''}" data-fa="${k}">${t}</button>`).join('')}</div>
    <div id="lista">${L.length?L.map(item).join(''):'<div class="vazio">Nada aqui. 👏</div>'}</div>
    <p class="sm muted" style="margin-top:12px">Os primeiros 90 dias decidem se o aluno fica. Contato nos dias ${(S.cfg.checkins||[]).map(c=>c.dia).join(', ')} após a matrícula.</p>`;
  $('#main').onclick=e=>{
    const f=e.target.closest('[data-fa]'); if(f){ S.filtroAl=f.dataset.fa; return vAlunos(); }
    const b=e.target.closest('[data-a]'); if(!b) return;
    const l=S.leads.find(x=>x.id===b.closest('.card').dataset.id); if(!l) return;
    if(b.dataset.a==='detalhes') return modalDetalhes(l);
    const cp=b.dataset.a==='checkin'?checkinPendente(l):null;
    modalCheckin(l,cp);
  };
}
function modalCheckin(l,cp){
  const dia=cp?cp.dia:(S.cfg.checkins||[]).map(c=>c.dia).filter(d=>d<=diasDesde(l.matriculadoEm)).pop()||0;

/* ======================= PAINEL (ADMIN) ======================= */
function periodo(){
  const h=new Date(); h.setHours(0,0,0,0);
  let ini=new Date(h), fim=new Date(h); fim.setDate(fim.getDate()+1);
  switch(S.periodo){
    case '7d': ini.setDate(ini.getDate()-6); break;
    case '30d': ini.setDate(ini.getDate()-29); break;
    case 'mes': ini.setDate(1); break;
    case 'mesant': ini=new Date(h.getFullYear(),h.getMonth()-1,1); fim=new Date(h.getFullYear(),h.getMonth(),1); break;
    case 'tudo': ini=new Date(2000,0,1); break;
    case 'custom':
      if(S.de) ini=new Date(S.de+'T00:00');
      if(S.ate){ fim=new Date(S.ate+'T00:00'); fim.setDate(fim.getDate()+1); }
      break;
  }
  return [ini,fim];
}
function barras(pares){
  if(!pares.length) return '<p class="muted sm">Sem dados no período.</p>';
  const max=Math.max(1,...pares.map(p=>p[1]));
  return `<div class="bars">${pares.map(([k,v,x])=>`<div class="bar"><span class="bl" title="${esc(k)}">${esc(k)}</span><div class="bt"><div style="width:${v/max*100}%"></div></div><span class="bv">${v}${x?` <small>${x}</small>`:''}</span></div>`).join('')}</div>`;
}
function colunas(vals,labels){
  const max=Math.max(1,...vals);
  return `<div class="cols">${vals.map((v,i)=>`<div class="col" title="${labels[i]}: ${v}"><div class="cv">${v||''}</div><div class="cb" style="height:${v/max*100}%"></div><div class="cl">${labels[i]}</div></div>`).join('')}</div>`;
}
const agrupa=(arr,fn)=>arr.reduce((m,x)=>{ const k=fn(x)||'—'; (m[k]=m[k]||[]).push(x); return m; },{});

      <div class="kpi"><div class="v">${et(2)}</div><div class="l">Visitas agendadas</div><div class="s">${et(3)} compareceram</div></div>
      <div class="kpi dest"><div class="v">${matr}</div><div class="l">Matrículas</div><div class="s">Conversão ${pct(matr,n)}</div></div>

function exportarCSV(L){
  if(!L.length) return toast('Nada para exportar');
  const cols=['Nome','WhatsApp','Origem','Campanha','Interesse','Status','Chegada','Resposta','Tempo resposta (min)','Atendido por','Fechou','Registrado por','Objeção','Detalhe objeção','Plano','Valor','Retornar em','Observação'];
  const linhas=L.map(l=>{ const c=toD(l.chegadaEm), r=toD(l.respondidoEm);
    return [l.nome,l.whatsapp,l.origem,l.campanha,l.interesse,ROTULO[l.status],c?c.toLocaleString('pt-BR'):'',r?r.toLocaleString('pt-BR'):'',

const din=v=>v==null||isNaN(v)||!isFinite(v)?'—':moeda(v);
const roiTxt=v=>v==null||isNaN(v)||!isFinite(v)?'—':(v>=0?'+':'')+Math.round(v*100)+'%';
function campanhasOrdenadas(){ const o={Ativa:0,Pausada:1,Encerrada:2}; return [...(S.campanhas||[])].sort((a,b)=>(o[a.status]??3)-(o[b.status]??3)||(b.inicio||'').localeCompare(a.inicio||'')); }

// Junta números da agência + leads do app, por campanha, no período
function calcCampanha(c,ini,fim){
  const iIni=isoDia(ini), iFim=isoDia(fim);
  const M=(S.metricas||[]).filter(m=>m.campanhaId===c.id && m.de>=iIni && m.de<iFim);
  const soma=k=>M.reduce((s,m)=>s+(+m[k]||0),0);
  const invest=soma('investimento'), alcance=soma('alcance'), impressoes=soma('impressoes'), cliques=soma('cliques'), conversas=soma('conversas');
  const freqPond=impressoes?M.reduce((s,m)=>s+(+m.frequencia||((+m.alcance)?(+m.impressoes)/(+m.alcance):0))*(+m.impressoes||0),0)/impressoes:null;
  const L=S.leads.filter(l=>l.campanha && l.campanha.trim().toLowerCase()===(c.nome||'').trim().toLowerCase() && toD(l.chegadaEm)>=ini && toD(l.chegadaEm)<fim);
  const leads=L.length, resp=L.filter(l=>(l.etapaMax||0)>=1).length, visitas=L.filter(l=>(l.etapaMax||0)>=2).length,
    vieram=L.filter(l=>(l.etapaMax||0)>=3).length, matr=L.filter(l=>(l.etapaMax||0)>=4).length;
  const receita1=L.filter(l=>l.status==='matriculado').reduce((s,l)=>s+(+l.valor||0),0), meses=+S.cfg.ltvMeses||6, receitaP=receita1*meses;
  return {c,M,invest,alcance,impressoes,cliques,conversas,freq:freqPond,
    cpc:conversas?invest/conversas:null, cpm:impressoes?invest/impressoes*1000:null, ctr:impressoes?cliques/impressoes:null,
    leads,resp,visitas,vieram,matr,aprov:conversas?leads/conversas:null,
    cpl:leads?invest/leads:null, cac:matr?invest/matr:null, receita1, receitaP,
    roi1:invest?(receita1-invest)/invest:null, roiP:invest?(receitaP-invest)/invest:null, L};
}
function somaCalc(arr){
  const t={invest:0,alcance:0,impressoes:0,cliques:0,conversas:0,leads:0,resp:0,visitas:0,vieram:0,matr:0,receita1:0,receitaP:0};
  arr.forEach(x=>Object.keys(t).forEach(k=>t[k]+=x[k]||0));
  t.cpc=t.conversas?t.invest/t.conversas:null; t.cpm=t.impressoes?t.invest/t.impressoes*1000:null; t.ctr=t.impressoes?t.cliques/t.impressoes:null;
  t.aprov=t.conversas?t.leads/t.conversas:null; t.cpl=t.leads?t.invest/t.leads:null; t.cac=t.matr?t.invest/t.matr:null;
  t.roi1=t.invest?(t.receita1-t.invest)/t.invest:null; t.roiP=t.invest?(t.receitaP-t.invest)/t.invest:null;
  t.freq=t.impressoes&&arr.some(x=>x.freq)?arr.reduce((s,x)=>s+(x.freq||0)*x.impressoes,0)/t.impressoes:null;
  return t;
}

function atraso(c){
  if(c.status!=='Ativa') return '';
  const ms=(S.metricas||[]).filter(m=>m.campanhaId===c.id), ult=ms.map(m=>m.ate).sort().pop();
  const dias=d=>Math.floor((new Date(isoDia(new Date())+'T00:00')-new Date(d+'T00:00'))/86400000);
  if(!ult){ return c.inicio&&dias(c.inicio)>=7?`Nenhum resultado lançado desde o início (${dias(c.inicio)} dias)`:''; }
  const d=dias(ult); return d>=7?`Sem resultado lançado há ${d} dias (último até ${diaBR(ult)})`:'';
}

function ligarCardsCampanha(alvo){
  $(alvo).addEventListener('click',async e=>{
    const b=e.target.closest('.camp [data-a]'); if(!b) return;
    const c=(S.campanhas||[]).find(x=>x.id===b.closest('.camp').dataset.cid); if(!c) return;
    const a=b.dataset.a;
    if(a==='mres') return modalMetrica(c);
    if(a==='medit') return modalCampanha(c);
    if(a==='mhist') return modalHistorico(c);
    if(a==='mcri') return modalCriativos(c);
    if(a==='mdel'){ if(!confirm('Excluir a campanha "'+c.nome+'" e os resultados lançados?')) return;
      for(const m of (S.metricas||[]).filter(m=>m.campanhaId===c.id)) await db.collection('metricas').doc(m.id).delete();
      await db.collection('campanhas').doc(c.id).delete(); return toast('Campanha excluída'); }
    if(a==='mret'){ const x=calcCampanha(c,new Date(2000,0,1),new Date(Date.now()+86400000));
      if(!confirm(`Enviar para a agência o retorno de "${c.nome}"?\n\n${x.leads} leads registrados · ${x.visitas} visitas · ${x.matr} matrículas\n\n(Sem valores, faturamento ou dados de clientes.)`)) return;

  });
}

/* ---------- importar planilha exportada do Gerenciador de Anúncios ---------- */
const semAcento=t=>String(t??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const COLUNAS={
  campanha:['nome da campanha','campaign name'],
  de:['inicio dos relatorios','reporting starts','dia','day','data'],
  ate:['termino dos relatorios','reporting ends'],
  investimento:['valor usado','amount spent','valor gasto'],
  alcance:['alcance','reach'],
  impressoes:['impressoes','impressions'],
  frequencia:['frequencia','frequency'],
  cliques:['cliques no link','link clicks','cliques (todos)','clicks (all)'],
  conversas:['conversas por mensagem iniciadas','messaging conversations started','conversas iniciadas'],
  resultados:['resultados','results'], indicador:['indicador de resultado','result indicator','tipo de resultado','result type']
};
function acharColuna(cab,chave){
  const alvos=COLUNAS[chave], h=cab.map(semAcento);
  for(const a of alvos){ const i=h.findIndex(x=>x===a||x.startsWith(a+' (')||x.startsWith(a)); if(i>=0) return i; }
  return -1;
}
function numMeta(v){
  if(typeof v==='number') return v; let t=String(v??'').replace(/[^\d.,-]/g,''); if(!t) return 0;
  const p=t.lastIndexOf('.'), c=t.lastIndexOf(',');
  if(p>=0&&c>=0) t=c>p?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');
  else if(c>=0) t=(t.length-c-1===3&&t.split(',').length>1&&!/^0,/.test(t))?t.replace(/,/g,''):t.replace(',','.');
  else if(p>=0&&t.split('.').length>2) t=t.replace(/\./g,'');
  const n=parseFloat(t); return isNaN(n)?0:n;
}
function dataMeta(v){
  if(v instanceof Date) return isoDia(v);
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*86400000)); return isoDia(new Date(d.getTime()+d.getTimezoneOffset()*60000)); }
  const t=String(v??'').trim(); let m;
  if((m=t.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return '';
}
function lerCSV(txt){
  txt=txt.replace(/^﻿/,''); const lin1=txt.split(/\r?\n/)[0]||'';
  const sep=[',',';','\t'].sort((a,b)=>lin1.split(b).length-lin1.split(a).length)[0];
  const linhas=[]; let row=[], cell='', q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true; else if(ch===sep){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; row.push(cell); linhas.push(row); row=[]; cell=''; }
    else cell+=ch; }
  if(cell||row.length){ row.push(cell); linhas.push(row); }
  return linhas.filter(r=>r.some(c=>String(c).trim()));
}
let _xlsx=null;
function carregarXLSX(){ return _xlsx||(_xlsx=new Promise((ok,erro)=>{ if(window.XLSX) return ok(window.XLSX);
  const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sc.onload=()=>ok(window.XLSX); sc.onerror=()=>{ _xlsx=null; erro(new Error('Não foi possível abrir arquivos Excel agora. Exporte em CSV.')); }; document.head.appendChild(sc); })); }
async function lerArquivo(f){
  if(/\.(xlsx|xls)$/i.test(f.name)){ const X=await carregarXLSX(); const wb=X.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    return X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}); }
  return lerCSV(await f.text());
}
function interpretar(tab){
  const iCab=tab.findIndex(r=>r.some(c=>['nome da campanha','campaign name'].includes(semAcento(c))));
  if(iCab<0) throw new Error('Não encontrei a coluna "Nome da campanha". Exporte a tabela no nível de Campanhas.');
  const cab=tab[iCab], col={}; Object.keys(COLUNAS).forEach(k=>col[k]=acharColuna(cab,k));
  if(col.investimento<0) throw new Error('Não encontrei a coluna "Valor usado". Inclua essa coluna na exportação.');
  const pega=(r,k)=>col[k]>=0?r[col[k]]:'';
  const hoje=isoDia(new Date());
  return tab.slice(iCab+1).map(r=>{
    const nome=String(pega(r,'campanha')||'').trim(); if(!nome) return null;
    const ind=semAcento(pega(r,'indicador'));
    let conv=col.conversas>=0?numMeta(pega(r,'conversas')):0;
    if(!conv && col.resultados>=0 && /messaging|conversa|mensage/.test(ind)) conv=numMeta(pega(r,'resultados'));
    const de=dataMeta(pega(r,'de'))||'', ate=dataMeta(pega(r,'ate'))||de||hoje;
    const alc=numMeta(pega(r,'alcance')), imp=numMeta(pega(r,'impressoes'));
    return {nome,de:de||ate,ate,investimento:Math.round(numMeta(pega(r,'investimento'))*100)/100,conversas:Math.round(conv),alcance:Math.round(alc),impressoes:Math.round(imp),
      frequencia:numMeta(pega(r,'frequencia'))||(alc&&imp?Math.round(imp/alc*100)/100:0),cliques:Math.round(numMeta(pega(r,'cliques')))};
  }).filter(x=>x&&(x.investimento||x.impressoes||x.conversas));
}

  abrirModal(`<h2>📥 Importar planilha do Meta</h2>
    <div class="passos sm"><b>Como exportar no Gerenciador de Anúncios:</b>

function previaImport(linhas,arquivo){
  const C=campanhasOrdenadas(), porNome=n=>C.find(c=>semAcento(c.nome)===semAcento(n));
  const opcoes=(l)=>{ const m=porNome(l.nome);
    return `<option value="novo" ${!m?'selected':''}>➕ Criar campanha "${esc(l.nome)}"</option>${C.map(c=>`<option value="${c.id}" ${m&&m.id===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}<option value="ignorar">✕ Não importar</option>`; };
  const dup=(l,cid)=>(S.metricas||[]).find(m=>m.campanhaId===cid&&m.de===l.de&&m.ate===l.ate);
  $('#impOut').innerHTML=`<p class="sm" style="margin:10px 0">Arquivo <b>${esc(arquivo)}</b>: ${linhas.length} linha(s). Confira antes de importar:</p>
    <div class="impLista">${linhas.map((l,i)=>{ const m=porNome(l.nome), d=m&&dup(l,m.id);
      return `<div class="impItem"><div class="row"><b>${esc(l.nome)}</b><span class="sm muted">${diaBR(l.de)} a ${diaBR(l.ate)}</span></div>
        <div class="sm">${moeda(l.investimento)} · <b>${inteiro(l.conversas)}</b> conversas · ${l.conversas?moeda(l.investimento/l.conversas)+'/conversa':'—'} · alcance ${inteiro(l.alcance)} · freq. ${dec(l.frequencia)}</div>
        <select data-imp="${i}">${opcoes(l)}</select>${d?'<div class="sm warnTxt">Já existe resultado desse período: vai ser atualizado.</div>':''}</div>`; }).join('')}</div>
    <button class="btn prim full" id="impOk" style="margin-top:12px">✅ Importar</button>`;
  $('#impOk').onclick=async()=>{
    const b=$('#impOk'); b.disabled=true; b.textContent='Importando...';
    let n=0; const criadas={};
    try{
      for(const [i,l] of linhas.entries()){
        let cid=$(`[data-imp="${i}"]`).value; if(cid==='ignorar') continue;
        let nomeC=l.nome;
        if(cid==='novo'){ const k=semAcento(l.nome);
          if(!criadas[k]){ const ref=await db.collection('campanhas').add({nome:l.nome,plataforma:PLATAFORMAS[0],status:'Ativa',objetivo:'Conversas iniciadas no WhatsApp',
              inicio:l.de,fim:'',orcamentoTotal:0,orcamentoDiario:0,publico:'',pixel:'Não',pixelObs:'',criativos:'',obs:'Criada pela importação',donoConta:'Agência',
              criadoPor:S.perfil.nome,atualizadoPor:S.perfil.nome,atualizadoEm:Date.now()}); criadas[k]=ref.id; }
          cid=criadas[k]; }
        else nomeC=(C.find(c=>c.id===cid)||{}).nome||l.nome;
        const d={campanhaId:cid,campanhaNome:nomeC,de:l.de,ate:l.ate,investimento:l.investimento,conversas:l.conversas,alcance:l.alcance,impressoes:l.impressoes,
          frequencia:l.frequencia,cliques:l.cliques,custoConversa:l.conversas?Math.round(l.investimento/l.conversas*100)/100:0,obs:'Importado de '+arquivo,por:S.perfil.nome,em:Date.now(),importado:true};
        const ex=dup(l,cid);
        if(ex) await db.collection('metricas').doc(ex.id).update(d); else await db.collection('metricas').add(d);
        n++;
      }
      fecharModal(); toast(`${n} resultado(s) importado(s) 📥`);
    }catch(err){ b.disabled=false; b.textContent='✅ Importar'; toast('Erro: '+err.message); }
  };
}

function relatorio(tipo){
  const [ini,fim]=periodo(), C=campanhasOrdenadas(), R=C.map(c=>calcCampanha(c,ini,fim)).filter(x=>x.invest||x.leads||x.c.status==='Ativa'), T=somaCalc(R);
  const interno=tipo==='interno';
  const Lp=S.leads.filter(l=>{ const c=toD(l.chegadaEm); return c>=ini&&c<fim; });

      ${R.map(x=>`<tr><td><b>${esc(x.c.nome)}</b><br><small>${esc(x.c.status||'')}</small></td><td>${diaBR(x.c.inicio)} a ${diaBR(x.c.fim)||'—'}</td><td class="n">${din(x.invest)}</td><td class="n">${inteiro(x.alcance)}</td><td class="n">${dec(x.freq)}</td>

        ${interno?`<td class="n">${din(x.receita1)}</td><td class="n">${roiTxt(x.roiP)}</td>`:''}</tr>`).join('')||'<tr><td colspan="13">Sem campanhas no período.</td></tr>'}
    </table>
    ${R.some(x=>(x.c.criativosArq||[]).length)?`<h2>Criativos</h2><div class="relCri">${R.flatMap(x=>(x.c.criativosArq||[]).map(a=>({a,c:x.c}))).slice(0,12).map(({a,c})=>

      ${[['Conversas iniciadas (agência)',T.conversas],['Leads registrados',T.leads],['Respondidos',T.resp],['Visitas agendadas',T.visitas],['Compareceram',T.vieram],['Matrículas',T.matr]]
        .map(([n,v])=>`<tr><td>${n}</td><td class="n">${inteiro(v)}</td><td class="n">${T.conversas?Math.round(v/T.conversas*100)+'%':'—'}</td></tr>`).join('')}
    </table>
    ${interno?`<div class="relDuas"><div><h2>Origem dos leads (todas)</h2><table class="relT"><tr><th>Origem</th><th class="n">Leads</th><th class="n">Matr.</th></tr>
        ${orig.map(([o,a,m])=>`<tr><td>${esc(o)}</td><td class="n">${a}</td><td class="n">${m}</td></tr>`).join('')||'<tr><td colspan="3">—</td></tr>'}</table></div>

    <div class="box"><h3>💰 Outros investimentos</h3>

/* ======================= EQUIPE ======================= */
let secApp=null;
const appSec = () => DEMO ? {auth:()=>({createUserWithEmailAndPassword:auth.createUserWithEmailAndPassword,
    signInWithEmailAndPassword:async()=>({user:{updatePassword:async()=>{}}}),signOut:async()=>{}})} : (secApp || (secApp=firebase.initializeApp(firebaseConfig,'secundario')));
async function senhaGuardada(uid){ try{ const d=await db.collection('senhas').doc(uid).get(); return d.exists?d.data().senha:''; }catch(e){ return ''; } }
function vEquipe(){
  const U=[...S.usuarios].sort((a,b)=>(a.papel>b.papel?1:-1)||a.nome.localeCompare(b.nome));
  $('#main').innerHTML=`
    <div class="box"><h3>Cadastrar acesso</h3>
      <form id="fU" class="form-in">
        <label>Nome<input id="uNome" required placeholder="Ex: Ana"></label>
        <label>Usuário (para entrar)<input id="uEmail" required placeholder="Ex: ana" autocapitalize="none" autocorrect="off"></label>
        <label>Senha (mín. 6)<input id="uSenha" type="text" minlength="6" required autocomplete="off"></label>
        <label>Tipo<select id="uPapel"><option value="recepcao">Recepção</option><option value="admin">Administrador</option><option value="agencia">Agência (marketing)</option></select></label>
        <button class="btn prim">Cadastrar</button>
      </form></div>
    <p class="sm muted" style="margin:-4px 2px 12px">Só o administrador cria, vê e troca as senhas. A equipe e a agência entram com usuário e senha, sem e-mail.</p>
    <div class="box"><h3>Equipe</h3><div class="tabw"><table>
      <tr><th>Nome</th><th>Usuário</th><th>Tipo</th><th class="n">Meta/mês</th><th></th></tr>
      ${U.map(u=>`<tr><td><b>${esc(u.nome)}</b></td><td class="sm">${esc(mostraLogin(u.email))}</td>
        <td><span class="tag ${u.papel==='admin'?'adm':''}">${{admin:'Admin',agencia:'Agência',recepcao:'Recepção'}[u.papel]||u.papel}</span> ${u.ativo?'':'<span class="tag off">Inativo</span>'}</td>
        <td class="n">${u.papel==='recepcao'?`<button class="btn sm" data-meta="${u.uid}">🎯 ${(S.cfg.metas||{})[u.uid]||'—'}</button>`:''}</td>
        <td class="n" style="white-space:nowrap"><button class="btn sm" data-ren="${u.uid}">Renomear</button>
          ${u.uid!==S.perfil.uid?`<button class="btn sm" data-ver="${u.uid}">👁 Senha</button><button class="btn sm" data-reset="${u.uid}">🔑 Trocar</button>`:''}
          ${u.uid!==S.perfil.uid?`<button class="btn sm ${u.ativo?'danger':''}" data-at="${u.uid}">${u.ativo?'Desativar':'Ativar'}</button>`:''}</td></tr>`).join('')}
    </table></div></div>`;
  $('#fU').onsubmit=async e=>{
    e.preventDefault(); const b=e.target.querySelector('button'); b.disabled=true;
    const nome=$('#uNome').value.trim(), bruto=$('#uEmail').value.trim(), papel=$('#uPapel').value, senha=$('#uSenha').value;
    if(!bruto.includes('@') && limpaUser(bruto).length<3){ b.disabled=false; return toast('Usuário com pelo menos 3 letras, sem espaço'); }
    const email=paraEmail(bruto);
    try{
      const cred=await appSec().auth().createUserWithEmailAndPassword(email,senha);
      await db.collection('usuarios').doc(cred.user.uid).set({nome,email,papel,ativo:true,criadoEm:FV.serverTimestamp()});
      await db.collection('senhas').doc(cred.user.uid).set({senha,em:Date.now()});
      await appSec().auth().signOut();
      toast(nome+' cadastrada(o) ✅'); e.target.reset();
    }catch(err){ toast(err.code==='auth/email-already-in-use'?'Esse usuário já existe':err.code==='auth/weak-password'?'Senha fraca: use 6 ou mais caracteres':'Erro: '+err.message); }
    b.disabled=false;
  };
  $('#main').querySelectorAll('[data-at]').forEach(b=>b.onclick=async()=>{
    const u=S.usuarios.find(x=>x.uid===b.dataset.at);
    await db.collection('usuarios').doc(u.uid).update({ativo:!u.ativo}); toast(u.ativo?'Acesso desativado':'Acesso ativado');
  });
  $('#main').querySelectorAll('[data-meta]').forEach(b=>b.onclick=async()=>{
    const u=S.usuarios.find(x=>x.uid===b.dataset.meta), atual=(S.cfg.metas||{})[u.uid]||'';
    const v=prompt('Meta de matrículas por mês para '+u.nome+':',atual); if(v===null) return;
    await db.collection('config').doc('geral').set({metas:{...(S.cfg.metas||{}),[u.uid]:parseInt(v)||0}},{merge:true}); toast('Meta salva 🎯');
  });
  $('#main').querySelectorAll('[data-ren]').forEach(b=>b.onclick=async()=>{
    const u=S.usuarios.find(x=>x.uid===b.dataset.ren); const n=prompt('Novo nome:',u.nome);
    if(n&&n.trim()){ await db.collection('usuarios').doc(u.uid).update({nome:n.trim()}); if(u.uid===S.perfil.uid) S.perfil.nome=n.trim(); toast('Nome atualizado'); }
  });
  $('#main').querySelectorAll('[data-ver]').forEach(b=>b.onclick=async()=>{
    const u=S.usuarios.find(x=>x.uid===b.dataset.ver), sn=await senhaGuardada(u.uid);
    abrirModal(`<h2>Acesso de ${esc(u.nome)}</h2>
      <p>Usuário: <b>${esc(mostraLogin(u.email))}</b></p><p style="margin-top:6px">Senha: <b>${sn?esc(sn):'(não guardada — use Trocar)'}</b></p>
      <div class="row" style="margin-top:14px"><button class="btn" id="vCopy" style="flex:1">📋 Copiar acesso</button><button class="btn ghost" data-fechar>Fechar</button></div>`,()=>{
      $('#vCopy').onclick=()=>copiar(`Acesso ao app Sky Fit Leads\n${location.href.split('?')[0].split('#')[0]}\nUsuário: ${mostraLogin(u.email)}\nSenha: ${sn}`);
    });
  });
  $('#main').querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{
    const u=S.usuarios.find(x=>x.uid===b.dataset.reset);
    let atual=await senhaGuardada(u.uid);
    if(!atual){ atual=prompt('Senha ATUAL de '+u.nome+':'); if(!atual) return; }
    const nova=prompt('Nova senha para '+u.nome+' (mínimo 6):'); if(!nova) return;
    if(nova.length<6) return toast('A senha precisa ter 6 ou mais caracteres');
    try{
      const a2=appSec().auth(); const c=await a2.signInWithEmailAndPassword(u.email,atual);
      await c.user.updatePassword(nova); await a2.signOut();
      await db.collection('senhas').doc(u.uid).set({senha:nova,em:Date.now()});
      toast('Senha de '+u.nome+' trocada 🔑');
    }catch(err){ toast(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential'||err.code==='auth/invalid-login-credentials'?'Senha atual não confere':'Erro: '+err.message); }
  });
}

    <h3 style="margin-top:22px">📲 Mensagens prontas</h3>

    <div class="duas">

      <label>Cadência de follow-up (dia = mensagem, contando da 1ª resposta)<textarea id="cCad" rows="8">${esc((c.cadencia||[]).map(x=>x.dia+' = '+x.texto).join('\n'))}</textarea></label>
      <label>Check-ins pós-venda (dia = mensagem, contando da matrícula)<textarea id="cCk" rows="8">${esc((c.checkins||[]).map(x=>x.dia+' = '+x.texto).join('\n'))}</textarea></label>

    </div>
    <h3 style="margin-top:22px">📝 Formulário de captura</h3>
    <p class="muted sm">Coloque o link no anúncio, na bio do Instagram ou num QR code na recepção. O lead cai direto no app com hora exata e campanha.</p>
    <label style="margin-top:8px">WhatsApp da academia (aparece no "obrigado" do formulário)<input id="cWA" type="tel" value="${esc(c.whatsAcademia||'')}" placeholder="(19) 99999-9999"></label>
    <div class="grid2"><label>Origem do link<select id="lkOrig">${opts(c.origens,'Instagram')}</select></label>
      <label>Campanha<input id="lkCamp" list="dlCampL" placeholder="nome da campanha"><datalist id="dlCampL">${(S.campanhas||[]).map(c=>`<option value="${esc(c.nome)}">`).join('')}</datalist></label></div>
    <div class="linkbox" id="lkOut"></div>
    <div class="row"><button class="btn" id="lkCopy" style="flex:1">📋 Copiar link</button><button class="btn" id="lkVer" style="flex:1">👁 Ver formulário</button></div>
    <button class="btn prim full" id="cSalvar">Salvar ajustes</button></div>`;
  const lista=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
  const porDia=id=>lista(id).map(x=>{ const i=x.indexOf('='); return {dia:parseInt(x.slice(0,i)),texto:x.slice(i+1).trim()}; }).filter(x=>x.dia>=0&&x.texto).sort((a,b)=>a.dia-b.dia);
  const base=location.href.split('?')[0].split('#')[0];
  const gerar=()=>{ const o=$('#lkOrig').value, cp=$('#lkCamp').value.trim(); const q='cadastro&origem='+encodeURIComponent(o)+(cp?'&campanha='+encodeURIComponent(cp):'');
    $('#lkOut').textContent=base+'?'+q; return q; };
  gerar(); $('#lkOrig').onchange=gerar; $('#lkCamp').oninput=gerar;
  $('#lkCopy').onclick=()=>copiar($('#lkOut').textContent);
  $('#iaSalvarK').onclick=async()=>{
    const k=$('#iaK').value.trim(); if(!k) return toast('Cole a chave primeiro');

    if(DEMO){ $('#iaK').value=''; return toast('Modo demonstração: a chave não é salva'); }
    try{
      await db.collection('segredos').doc('ia').set({chave:k,em:Date.now(),por:S.perfil.nome});
      await db.collection('config').doc('geral').set({iaChaveFinal:k.slice(-4)},{merge:true});
      $('#iaK').value=''; toast('Chave salva com segurança 🔒');
    }catch(err){ toast('Erro: '+err.message); }

    if(!url){ st.textContent='Preencha a URL da função e salve os ajustes.'; return; }
    st.textContent='Testando...';
    try{
      const token=await auth.currentUser.getIdToken();
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({teste:true})});
      const j=await r.json(); if(!r.ok) throw new Error(j.erro||r.status);
      st.innerHTML='<span style="color:var(--grn)">✅ IA funcionando ('+esc(j.modelo)+')</span>';
    }catch(err){ st.innerHTML='<span class="red">❌ '+esc(err.message)+'</span>'; }
  };
  $('#lkVer').onclick=()=>{ S.formParams=gerar(); S.previewForm=true; telaForm(true); window.scrollTo(0,0); };
  $('#cSalvar').onclick=async()=>{
    await db.collection('config').doc('geral').set({origens:lista('#cOrig'),interesses:lista('#cInt'),objecoes:lista('#cObj'),
      alertaMin:parseInt($('#cAl').value)||15,msgWhats:$('#cMsg').value,baseIA:$('#cBase').value,
      iaUrl:$('#iaU').value.trim(),iaModelo:$('#iaM').value,
      msgLembreteDia:$('#cLD').value,msgLembreteHora:$('#cLH').value,cadencia:porDia('#cCad'),checkins:porDia('#cCk'),
      msgRepescagem:$('#cRep').value,diasRepescagem:parseInt($('#cRepD').value)||30,comissao:parseFloat($('#cCom').value)||0,ltvMeses:parseInt($('#cLtv').value)||6,whatsAcademia:$('#cWA').value.trim(),
      planos:lista('#cPlanos').map(x=>{ const [n,v]=x.split('='); return {nome:(n||'').trim(),valor:parseFloat((v||'0').trim().replace(/\./g,'').replace(',','.'))||0}; }).filter(p=>p.nome)},{merge:true});
    await db.collection('config').doc('publico').set({interesses:lista('#cInt'),whatsAcademia:$('#cWA').value.trim()},{merge:true});
    toast('Ajustes salvos ✅');
  };
}
</script>
